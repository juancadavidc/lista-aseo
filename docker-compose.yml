services:
  api:
    image: ghcr.io/juancadavidc/lista-aseo/api:latest
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://home-care.stack-less.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3001"
    volumes:
      - uploads:/app/uploads

  web:
    image: ghcr.io/juancadavidc/lista-aseo/web:latest
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

volumes:
  uploads:
